[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "semantic-data-nexus-plugins"
version = "0.1.0"
description = "Governed v1 extensions for the shared query runtime"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "semantic-query-runtime==0.1.0",
  "semantic-data-nexus-databricks==0.1.0",
  "psycopg[binary]==3.3.4",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "jsonschema>=4.23,<5",
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_plugins"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["postgres: real PostgreSQL 16 integration (explicit dedicated CI job)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["pyarrow.*", "duckdb.*"]
ignore_missing_imports = true
