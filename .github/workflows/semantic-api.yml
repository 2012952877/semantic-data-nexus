name: Semantic API

on:
  workflow_call:
  pull_request:
    paths:
      - "services/semantic-api/**"
      - "contracts/compiler/v1/**"
      - ".github/workflows/semantic-api.yml"
  push:
    paths:
      - "services/semantic-api/**"
      - "contracts/compiler/v1/**"
      - ".github/workflows/semantic-api.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: compiler_test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: compiler_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compiler_test -d compiler_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_COMPILER_POSTGRES_DSN: "postgresql://compiler_test:synthetic-ci-only@127.0.0.1:5432/compiler_test"
    defaults:
      run:
        working-directory: services/semantic-api

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/semantic-api/pyproject.toml
      - name: Install package and tools
        run: python -m pip install -e ".[dev,postgres]" build
      - name: Check formatting
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Test
        run: pytest --junitxml=test-results.xml
      - name: Require real PostgreSQL clarification tests
        shell: python
        run: |
          import xml.etree.ElementTree as ET
          root = ET.parse("test-results.xml").getroot()
          cases = [case for case in root.iter("testcase")
                   if "test_catalog_postgres" in case.attrib.get("classname", "")]
          assert len(cases) >= 7, f"Expected PostgreSQL cases, got {len(cases)}"
          assert all(not list(case) for case in cases), "PostgreSQL case failed or skipped"
          print(f"Real PostgreSQL clarification tests passed: {len(cases)}")
      - name: Check generated compiler contracts
        working-directory: .
        run: |
          python -m semantic_api.catalog_v1.export_contracts
          git diff --exit-code -- contracts/compiler/v1
      - name: Build packages
        run: python -m build
