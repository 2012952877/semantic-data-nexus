name: query-runtime

on:
  pull_request:
    paths:
      - "services/query-runtime/**"
      - ".github/workflows/query-runtime.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/query-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/query-runtime/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src
      - run: pytest
      - run: python -m build
