name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  semantic-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Test contracts and validation
        run: python -m pytest
      - name: Validate example through CLI
        run: >-
          python -m semantic_core validate
          examples/regional-quarter-profit.json
          --ontology examples/retail-ontology.json
