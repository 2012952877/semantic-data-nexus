name: Full stack Compose

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "connectors/databricks/**"
      - "data/synthetic/**"
      - "docs/operations/local-compose.md"
      - "ops/compose/**"
      - "scripts/**"
      - "services/control-api/**"
      - "services/query-runtime/**"
      - "services/semantic-api/**"
      - "services/semantic-backend/**"
      - ".dockerignore"
      - ".env.example"
      - "compose.yaml"
      - "compose.databricks.yaml"
      - ".github/workflows/full-stack.yml"
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "connectors/databricks/**"
      - "data/synthetic/**"
      - "docs/operations/local-compose.md"
      - "ops/compose/**"
      - "scripts/**"
      - "services/control-api/**"
      - "services/query-runtime/**"
      - "services/semantic-api/**"
      - "services/semantic-backend/**"
      - ".dockerignore"
      - ".env.example"
      - "compose.yaml"
      - "compose.databricks.yaml"
      - ".github/workflows/full-stack.yml"

permissions:
  contents: read

concurrency:
  group: full-stack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXUS_WEB_PORT: "8080"
      SEMANTIC_NEXUS_FAKE_DELAY_MS: "750"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install browser smoke dependencies
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Test integration validators
        run: python -m unittest discover -s scripts/tests -p "test_*.py"

      - name: Validate Compose configuration
        run: |
          docker compose config --quiet
          docker compose config --format json | python scripts/validate_compose_config.py

      - name: Verify live configuration fails closed
        env:
          DATABRICKS_WORKSPACE_HOST: ""
          DATABRICKS_WAREHOUSE_ID: ""
          DATABRICKS_TOKEN: ""
        run: |
          if docker compose -f compose.yaml -f compose.databricks.yaml --profile databricks config --quiet > /dev/null 2> live-config-error.txt; then
            echo "Databricks Compose configuration unexpectedly accepted missing credentials." >&2
            exit 1
          fi
          test -s live-config-error.txt
          rm live-config-error.txt

      - name: Validate live profile topology
        run: |
          export DATABRICKS_WORKSPACE_HOST="https://example.invalid"
          export DATABRICKS_WAREHOUSE_ID="ci-placeholder"
          export DATABRICKS_TOKEN="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          docker compose -f compose.yaml -f compose.databricks.yaml --profile databricks config --format json |
            python scripts/validate_compose_config.py --live
          unset DATABRICKS_WORKSPACE_HOST DATABRICKS_WAREHOUSE_ID DATABRICKS_TOKEN

      - name: Build local images
        run: docker compose build

      - name: Start healthy fake-resolver stack
        run: docker compose up --detach --wait --wait-timeout 180

      - name: Verify hardened fake-resolver runtime
        run: |
          for service in semantic-backend control-api web; do
            test "$(docker compose exec -T "$service" id -u)" -ne 0
          done
          docker compose exec -T semantic-backend python -c \
            "import os; assert os.environ['SEMANTIC_NEXUS_RESOLVER'] == 'fake'; assert not os.environ.get('DATABRICKS_TOKEN')"

      - name: Run real HTTP full-stack smoke
        run: python scripts/full_stack_smoke.py --base-url http://127.0.0.1:8080

      - name: Run deployed Web browser smoke
        working-directory: apps/web
        env:
          NEXUS_FULL_STACK_BASE_URL: http://127.0.0.1:8080
        run: pnpm run test:e2e:full-stack

      - name: Capture Compose diagnostics
        if: failure()
        run: |
          mkdir -p full-stack-diagnostics
          docker compose ps --all > full-stack-diagnostics/compose-ps.txt 2>&1 || true
          docker compose logs --no-color --timestamps > full-stack-diagnostics/compose.log 2>&1 || true
          if [ -d apps/web/test-results ]; then
            cp -R apps/web/test-results full-stack-diagnostics/playwright-test-results
          fi

      - name: Upload Compose diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-stack-compose-diagnostics
          path: full-stack-diagnostics
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear down Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans
