name: Databricks resolver

on:
  pull_request:
    paths:
      - "connectors/databricks/**"
      - ".github/workflows/databricks-resolver.yml"
  push:
    branches:
      - main
    paths:
      - "connectors/databricks/**"
      - ".github/workflows/databricks-resolver.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: connectors/databricks

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: connectors/databricks/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy src
      - name: Build
        run: python -m build
