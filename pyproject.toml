[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-data-nexus-core"
version = "0.1.0"
description = "Versioned semantic query contracts and deterministic validation"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23,<5",
  "pytest>=8.3,<9",
]

[project.scripts]
sqg-validate = "semantic_core.cli:main"

[tool.setuptools]
package-dir = { "" = "packages/semantic-core/src" }

[tool.setuptools.packages.find]
where = ["packages/semantic-core/src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

