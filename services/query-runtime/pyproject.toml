[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "semantic-query-runtime"
version = "0.1.0"
description = "Capability-aware, observable query runtime for validated physical plans"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.2,<2",
  "pyarrow>=23.0.1,<24",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.9",
]

[project.scripts]
query-runtime = "query_runtime.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/query_runtime"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["query_runtime"]

[[tool.mypy.overrides]]
module = ["duckdb.*", "pyarrow.*"]
ignore_missing_imports = true
