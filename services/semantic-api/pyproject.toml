[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "semantic-api"
version = "0.1.0"
description = "Clean-room semantic initializer and typed SQG compiler service"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "pydantic>=2.10,<3",
  "tzdata>=2025.2",
  "uvicorn>=0.34,<1",
  "azure-identity>=1.25,<2",
  "aiohttp>=3.11,<4",
]

[project.optional-dependencies]
postgres = [
  "psycopg[binary]==3.3.4",
]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
  "types-jsonschema>=4.23",
]

[project.scripts]
semantic-api = "semantic_api.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/semantic_api"]

[tool.hatch.build.targets.wheel.force-include]
"src/semantic_api/resources/ontology.v0.json" = "semantic_api/resources/ontology.v0.json"

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["semantic_api"]
