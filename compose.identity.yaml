name: semantic-data-nexus-identity

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: nexus_identity
      POSTGRES_USER: nexus_identity
      POSTGRES_PASSWORD: "${IDENTITY_DATABASE_PASSWORD:?Generate local identity fixtures first}"
    volumes:
      - identity-database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus_identity -d nexus_identity"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [identity]

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    command:
      - start-dev
      - --import-realm
      - --hostname=https://identity.localhost:8443
      - --http-enabled=false
      - --https-certificate-file=/fixtures/tls.crt
      - --https-certificate-key-file=/fixtures/tls.key
    volumes:
      - ./ops/identity/.generated:/fixtures:ro
      - ./ops/identity/.generated/realm.json:/opt/keycloak/data/import/nexus-realm.json:ro
      - keycloak-data:/opt/keycloak/data
    ports: ["127.0.0.1:8443:8443"]
    networks:
      identity:
        aliases: [identity.localhost]

  semantic-backend:
    image: semantic-data-nexus/semantic-backend:identity
    build:
      context: .
      dockerfile: services/semantic-backend/Dockerfile
    env_file: ./ops/identity/.generated/backend.env
    command:
      - python
      - /catalog-test/catalog_test_host.py
      - --fixtures
      - /fixtures
      - --host
      - 0.0.0.0
    environment:
      SEMANTIC_NEXUS_AUTH_MODE: service
      SEMANTIC_NEXUS_ENVIRONMENT: Development
      SEMANTIC_NEXUS_RESOLVER: fake
      SEMANTIC_NEXUS_DATA_DIR: /app/data/synthetic/generated
      SEMANTIC_NEXUS_FAKE_DELAY_MS: "50"
      SEMANTIC_NEXUS_CATALOG_CONFIG: /fixtures/catalog-server.json
      SEMANTIC_CATALOG_PROVIDER_MODE: openai_compatible
      SEMANTIC_CATALOG_PROVIDER_MODEL: synthetic-public-model
      SEMANTIC_CATALOG_PROVIDER_ENDPOINT: http://127.0.0.1:8099/v1/chat/completions
      SEMANTIC_CATALOG_PROVIDER_CREDENTIAL_ENV: SYNTHETIC_CATALOG_MODEL_KEY
      SEMANTIC_CATALOG_PROVIDER_ALLOW_LOCAL_MOCK: "true"
      SYNTHETIC_CATALOG_MODEL_KEY: synthetic-local-model-only
    volumes:
      - ./services/semantic-backend/integration:/catalog-test:ro
      - ./ops/identity/.generated:/fixtures:ro
      - ./ops/identity/.generated/catalog-observations:/fixtures/catalog-observations
    depends_on:
      postgres: { condition: service_healthy }
    networks: [identity]

  control-api:
    image: semantic-data-nexus/control-api:identity
    build:
      context: services/control-api
      dockerfile: Dockerfile
    env_file: ./ops/identity/.generated/control.env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      LocalDevelopmentAuth__Enabled: "false"
      AllowedHosts: "localhost;127.0.0.1;control-api"
      ASPNETCORE_HTTP_PORTS: "8080"
      ASPNETCORE_HTTPS_PORTS: "8445"
      ASPNETCORE_Kestrel__Certificates__Default__Path: /fixtures/tls.pfx
      SSL_CERT_FILE: /fixtures/ca.crt
      Identity__DataProtectionKeyRing: /keyring
      RunStorage__Provider: Postgres
      SemanticBackend__UseFake: "false"
      SemanticBackend__BaseUri: http://semantic-backend:8080/
      SemanticBackend__TimeoutSeconds: "15"
    volumes:
      - ./ops/identity/.generated:/fixtures:ro
      - ./ops/identity/.generated/keyring:/keyring
    depends_on:
      postgres: { condition: service_healthy }
    networks: [identity]

  web:
    image: semantic-data-nexus/web:identity
    build:
      context: apps/web
      dockerfile: Dockerfile
      args:
        VITE_NEXUS_AUTH_MODE: oidc
    ports: ["127.0.0.1:8444:8444"]
    volumes:
      - ./ops/identity/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ops/identity/.generated:/fixtures:ro
    depends_on: [control-api, keycloak]
    networks: [identity]

networks:
  identity:
volumes:
  identity-database:
  keycloak-data:
