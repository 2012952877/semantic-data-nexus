[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "semantic-data-nexus-evals"
version = "0.1.0"
description = "Provider-independent semantic query golden evaluator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = [
  "duckdb>=1.1,<2",
  "pytest>=8.3,<9",
]

[project.scripts]
semantic-eval = "semantic_eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/semantic_eval"]

[tool.hatch.build.targets.wheel.force-include]
"fixtures" = "semantic_eval/fixtures"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
