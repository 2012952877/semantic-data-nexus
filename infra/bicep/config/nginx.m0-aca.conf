map_hash_bucket_size 128;
server_names_hash_bucket_size 128;

map $http_origin $m0_origin_allowed {
    default 0;
    "" 1;
    "https://__APP_HOST__" 1;
    "https://__APP_HOST__:443" 1;
}

server {
    listen 8080 default_server;
    server_name __APP_HOST__;
    server_tokens off;

    if ($http_host !~* "^__APP_HOST_REGEX__(?::443)?$") {
        return 421;
    }

    auth_basic "Semantic Data Nexus synthetic test";
    auth_basic_user_file /etc/nexus-auth/htpasswd;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64k;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=86400" always;

    location /api/ {
        if ($m0_origin_allowed = 0) {
            return 403;
        }

        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host "127.0.0.1";
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto "https";
        proxy_set_header X-Correlation-ID $request_id;
        proxy_set_header X-Dev-Subject "local-compose-user";
        proxy_set_header X-Dev-Name "Synthetic HTTPS Test User";
        proxy_set_header X-Dev-Roles "reader,contributor,admin";
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
        proxy_buffering off;
        proxy_cache_bypass 1;
        proxy_no_cache 1;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}

# This port is for ACA probes only; it is never an ingress target.
server {
    listen 8083;
    server_name _;
    server_tokens off;
    access_log off;

    location = /health/live {
        default_type application/json;
        return 200 '{"status":"live"}';
    }

    location = /health/ready {
        proxy_set_header Host "127.0.0.1";
        proxy_set_header Authorization "";
        proxy_pass http://127.0.0.1:8081/health/ready;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location / {
        return 404;
    }
}
