#cloud-config
package_update: true
packages:
  - ca-certificates
  - curl
  - docker.io
  - docker-compose-v2
  - openssl
  - python3
  - stunnel4

ssh_pwauth: false
disable_root: true

write_files:
  - path: /etc/ssh/sshd_config.d/00-sdn-m0.conf
    owner: root:root
    permissions: '0600'
    content: |
      Port __SDN_SSH_PORT__
      ListenAddress __SDN_SSH_BIND__
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      PubkeyAuthentication yes
      AllowUsers __SDN_ADMIN_USERNAME__
      AllowTcpForwarding local
      PermitOpen 127.0.0.1:8080
      GatewayPorts no
      AllowAgentForwarding no
      X11Forwarding no
      PermitTunnel no
  - path: /etc/systemd/system/ssh.socket.d/zz-sdn-m0.conf
    owner: root:root
    permissions: '0644'
    content: |
      [Socket]
      ListenStream=
      ListenStream=__SDN_SSH_BIND__:__SDN_SSH_PORT__
  - path: /etc/semantic-data-nexus/ssh-tls.conf
    owner: root:root
    permissions: '0600'
    content: |
      foreground = yes
      pid =
      setuid = stunnel4
      setgid = stunnel4
      debug = notice

      [ssh]
      accept = 0.0.0.0:443
      connect = 127.0.0.1:22
      cert = /etc/semantic-data-nexus/ssh-tls.crt
      key = /etc/semantic-data-nexus/ssh-tls.key
      sslVersionMin = TLSv1.2
  - path: /etc/systemd/system/sdn-m0-ssh-tls.service
    owner: root:root
    permissions: '0644'
    content: |
      [Unit]
      Description=Certificate-pinned TLS transport for private M0 SSH
      After=network-online.target ssh.service
      Wants=network-online.target
      Requires=ssh.service

      [Service]
      Type=simple
      ExecStart=/usr/bin/stunnel4 /etc/semantic-data-nexus/ssh-tls.conf
      Restart=on-failure
      RestartSec=5
      NoNewPrivileges=true
      PrivateTmp=true
      ProtectSystem=strict
      ProtectHome=true

      [Install]
      WantedBy=multi-user.target
  - path: /usr/local/sbin/sdn-m0-ssh-tls-setup
    owner: root:root
    permissions: '0700'
    content: |
      #!/bin/sh
      set -eu
      case "$1" in
        false) exit 0 ;;
        true) ;;
        *) echo "Expected an explicit TLS enable flag." >&2; exit 1 ;;
      esac
      directory=/etc/semantic-data-nexus
      umask 077
      if test -e "$directory/ssh-tls.key" || test -e "$directory/ssh-tls.crt"; then
        if ! test -s "$directory/ssh-tls.key" || ! test -s "$directory/ssh-tls.crt"; then
          echo "Incomplete TLS material; refusing to replace it automatically." >&2
          exit 1
        fi
      else
        openssl req -x509 -newkey rsa:3072 -sha256 -nodes \
          -keyout "$directory/ssh-tls.key" -out "$directory/ssh-tls.crt" \
          -days 30 -subj "/CN=sdn-m0-ssh" \
          -addext "subjectAltName=IP:$2" \
          -addext "basicConstraints=critical,CA:TRUE" \
          -addext "keyUsage=critical,digitalSignature,keyEncipherment,keyCertSign" \
          -addext "extendedKeyUsage=serverAuth"
      fi
      chmod 600 "$directory/ssh-tls.key"
      openssl verify -CAfile "$directory/ssh-tls.crt" -verify_ip "$2" "$directory/ssh-tls.crt"
      systemctl enable --now sdn-m0-ssh-tls.service
  - path: /etc/docker/daemon.json
    owner: root:root
    permissions: '0644'
    content: |
      {
        "log-driver": "local",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
  - path: /etc/systemd/system/semantic-data-nexus.service
    owner: root:root
    permissions: '0644'
    content: |
      [Unit]
      Description=Private synthetic Semantic Data Nexus M0
      Requires=docker.service
      After=docker.service network-online.target
      Wants=network-online.target
      ConditionPathExists=/opt/semantic-data-nexus/compose.yaml

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      WorkingDirectory=/opt/semantic-data-nexus
      ExecStart=/usr/bin/docker compose up --detach --wait --wait-timeout 180 --no-build
      ExecStop=/usr/bin/docker compose down --remove-orphans
      TimeoutStartSec=300
      TimeoutStopSec=120

      [Install]
      WantedBy=multi-user.target

runcmd:
  - [sshd, -t]
  - [systemctl, daemon-reload]
  - [systemctl, enable, --now, docker]
  - [systemctl, enable, semantic-data-nexus]
  - [systemctl, stop, ssh.service]
  - [systemctl, restart, ssh.socket]
  - [systemctl, start, ssh.service]
  - [sh, /usr/local/sbin/sdn-m0-ssh-tls-setup, '__SDN_TLS_ENABLED__', '__SDN_TLS_SERVER_IP__']
