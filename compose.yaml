name: semantic-data-nexus

services:
  semantic-backend:
    image: semantic-data-nexus/semantic-backend:local
    build:
      context: .
      dockerfile: services/semantic-backend/Dockerfile
    environment:
      SEMANTIC_NEXUS_DATA_DIR: /app/data/synthetic/generated
      SEMANTIC_NEXUS_FAKE_DELAY_MS: "${SEMANTIC_NEXUS_FAKE_DELAY_MS:-750}"
      SEMANTIC_NEXUS_RESOLVER: fake
    init: true
    stop_grace_period: 60s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=2)
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 10
    networks:
      - backend

  control-api:
    image: semantic-data-nexus/control-api:local
    build:
      context: services/control-api
      dockerfile: Dockerfile
    environment:
      AllowedHosts: "127.0.0.1;localhost"
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      LocalDevelopmentAuth__Enabled: "true"
      OpenApi__Enabled: "false"
      SemanticBackend__BaseUri: http://semantic-backend:8080/
      SemanticBackend__TimeoutSeconds: "15"
      SemanticBackend__UseFake: "false"
    depends_on:
      semantic-backend:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://127.0.0.1:8080/health/ready
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 10
    networks:
      - edge
      - backend

  web:
    image: semantic-data-nexus/web:local
    build:
      context: apps/web
      dockerfile: Dockerfile
    depends_on:
      control-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${NEXUS_WEB_PORT:-8080}:8080"
    volumes:
      - ./ops/compose/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/health/live
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10
    networks:
      - edge

networks:
  edge:
  backend:
    internal: true
