check-for-app-update: false
scope: squashed
parallelism: 4
enrich: []
license:
  content: all
file:
  metadata:
    selection: owned-by-package
    digests: [sha256]
relationships:
  package-file-ownership: true
dotnet:
  dep-packages-must-have-dll: false
  dep-packages-must-claim-dll: false
  exclude-project-references: false
python:
  guess-unpinned-requirements: false
  search-remote-licenses: false
javascript:
  search-remote-licenses: false
  include-dev-dependencies: true
golang:
  search-local-mod-cache-licenses: false
  search-local-vendor-licenses: false
  search-remote-licenses: false
  use-packages-lib: false
java:
  use-network: false
  use-maven-local-repository: false
