services:
  semantic-backend:
    profiles:
      - databricks
    networks:
      - backend
      - databricks-egress
    environment:
      SEMANTIC_NEXUS_RESOLVER: databricks
      SEMANTIC_NEXUS_FAKE_DELAY_MS: "0"
      DATABRICKS_WORKSPACE_HOST: "${DATABRICKS_WORKSPACE_HOST:?Set DATABRICKS_WORKSPACE_HOST in the current shell}"
      DATABRICKS_WAREHOUSE_ID: "${DATABRICKS_WAREHOUSE_ID:?Set DATABRICKS_WAREHOUSE_ID in the current shell}"
      DATABRICKS_CATALOG: "${DATABRICKS_CATALOG:-synthetic_demo}"
      DATABRICKS_SCHEMA: "${DATABRICKS_SCHEMA:-analytics}"
      DATABRICKS_TOKEN: "${DATABRICKS_TOKEN:?Set DATABRICKS_TOKEN in the current shell}"

networks:
  databricks-egress:
