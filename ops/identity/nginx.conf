server {
    listen 8444 ssl;
    server_name localhost;
    ssl_certificate /fixtures/tls.crt;
    ssl_certificate_key /fixtures/tls.key;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64k;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; connect-src 'self'; form-action 'self' https://identity.localhost:8443; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    location ~ ^/(api|auth)/ {
        proxy_pass https://control-api:8445;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /fixtures/ca.crt;
        proxy_ssl_name control-api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Dev-Subject "";
        proxy_set_header X-Dev-Name "";
        proxy_set_header X-Dev-Roles "";
        proxy_buffering off;
        proxy_read_timeout 35s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
